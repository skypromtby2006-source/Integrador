<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Didactai — Editar perfil</title>
  <link rel="stylesheet" href="m3-theme.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  <style>
    .screen { min-height: 100dvh; }
    .scroll-content { padding: 0 0 24px; }

    /* Avatar section */
    .avatar-section {
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px 16px; gap: 12px;
    }
    .profile-avatar-lg {
      width: 88px; height: 88px; border-radius: 50%;
      background: linear-gradient(135deg, #82008C 0%, #40798C 100%);
      border: 3px solid var(--success-container);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 500; color: white;
      position: relative;
    }
    .avatar-edit-badge {
      position: absolute; bottom: 0; right: 0;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--primary); border: 2px solid var(--background);
      display: flex; align-items: center; justify-content: center;
    }
    .avatar-name { font-size: 18px; font-weight: 500; color: var(--on-surface); }
    .avatar-sub  { font-size: 13px; color: var(--on-surface-variant); }
    .btn-change-photo {
      background: none; border: 1px solid var(--outline-variant);
      border-radius: var(--radius-full); padding: 6px 16px;
      font-size: 13px; font-weight: 500; cursor: pointer; color: var(--primary);
      font-family: inherit;
    }

    /* Form section */
    .form-section { padding: 0 16px; margin-bottom: 16px; }
    .form-label {
      font-size: 11px; letter-spacing: 1.2px; font-weight: 500; color: var(--primary);
      padding: 4px 8px; margin-bottom: 4px; display: block;
    }
    .form-card {
      background: var(--surface-container-low);
      border-radius: var(--radius-md); padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .text-field {
      width: 100%; border: none; border-bottom: 1px solid var(--outline-variant);
      background: transparent; font-size: 16px; color: var(--on-surface);
      padding: 4px 0; font-family: inherit; outline: none;
    }
    .text-field:focus { border-bottom-color: var(--primary); }
    .field-label-sm {
      font-size: 11px; font-weight: 500; color: var(--on-surface-variant);
      letter-spacing: .5px; margin-bottom: 2px;
    }
    .field-group { display: flex; flex-direction: column; gap: 2px; }

    .row-two { display: flex; gap: 16px; }
    .row-two .field-group { flex: 1; }

    /* Switch row */
    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0;
    }
    .switch-row-text { flex: 1; }
    .switch-row-title { font-size: 14px; font-weight: 500; color: var(--on-surface); }
    .switch-row-sub   { font-size: 12px; color: var(--on-surface-variant); }

    /* Photo bottom sheet */
    .sheet-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50;
      align-items: flex-end;
    }
    .sheet-overlay.open { display: flex; }
    .sheet {
      width: 100%; max-width: 430px; margin: 0 auto;
      background: var(--surface-container-low); border-radius: 28px 28px 0 0;
      padding: 16px 0 32px;
    }
    .sheet-handle {
      width: 32px; height: 4px; border-radius: 2px;
      background: var(--outline-variant); margin: 0 auto 16px;
    }
    .sheet-title {
      font-size: 16px; font-weight: 500; padding: 0 16px 8px;
    }
    .sheet-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer;
    }
    .sheet-item:hover { background: rgba(0,0,0,.04); }
    .sheet-item .material-symbols-rounded { color: var(--on-surface-variant); }

    /* Save dock */
    .save-dock {
      padding: 12px 16px 24px;
      border-top: 1px solid var(--outline-variant);
      background: var(--background);
      position: sticky; bottom: 0;
    }
  </style>
</head>
<body>
<div class="screen">

  <!-- Top bar — close/Cancelar → Settings_C.html -->
  <div class="top-bar">
    <button class="icon-btn" id="btn-cancel" onclick="goTo('Settings_C.html')">
      <span class="material-symbols-rounded">close</span>
    </button>
    <div class="bar-title">Editar perfil</div>
    <div class="bar-actions">
      <!-- Guardar → Settings_C.html -->
      <button class="btn btn-text" id="btn-save-header" onclick="goTo('Settings_C.html')">Guardar</button>
    </div>
  </div>

  <div class="scroll-content">

    <!-- Avatar -->
    <div class="avatar-section">
      <div class="profile-avatar-lg">
        A
        <div class="avatar-edit-badge" onclick="openSheet()">
          <span class="material-symbols-rounded" style="font-size:14px;color:white">edit</span>
        </div>
      </div>
      <div class="avatar-name">Ana Rivera</div>
      <div class="avatar-sub">ana.rivera@escuela.mx</div>
      <button class="btn-change-photo" onclick="openSheet()">Cambiar foto</button>
    </div>

    <!-- Datos personales -->
    <div class="form-section">
      <span class="form-label">DATOS PERSONALES</span>
      <div class="form-card">
        <div class="row-two">
          <div class="field-group">
            <div class="field-label-sm">NOMBRE</div>
            <input class="text-field" type="text" value="Ana">
          </div>
          <div class="field-group">
            <div class="field-label-sm">APELLIDO</div>
            <input class="text-field" type="text" value="Rivera">
          </div>
        </div>
        <div class="field-group">
          <div class="field-label-sm">NOMBRE VISIBLE</div>
          <input class="text-field" type="text" value="Ana R.">
        </div>
        <div class="field-group">
          <div class="field-label-sm">FECHA DE NACIMIENTO</div>
          <input class="text-field" type="text" value="14/03/2009">
        </div>
      </div>
    </div>

    <!-- Cuenta -->
    <div class="form-section">
      <span class="form-label">CUENTA</span>
      <div class="form-card">
        <div class="field-group">
          <div class="field-label-sm">CORREO</div>
          <input class="text-field" type="email" value="ana.rivera@escuela.mx">
        </div>
        <div class="switch-row">
          <div class="switch-row-text">
            <div class="switch-row-title">Touch ID</div>
            <div class="switch-row-sub">Acceso biométrico rápido</div>
          </div>
          <label class="switch-wrap">
            <input type="checkbox" checked>
            <div class="switch-track"></div>
            <div class="switch-thumb"></div>
          </label>
        </div>
      </div>
    </div>

    <!-- Clase -->
    <div class="form-section">
      <span class="form-label">CLASE</span>
      <div class="form-card">
        <div class="field-group">
          <div class="field-label-sm">CÓDIGO DE CLASE</div>
          <input class="text-field" type="text" value="BIO-3B-2026">
        </div>
      </div>
    </div>

  </div>

  <!-- Save dock -->
  <div class="save-dock">
    <button class="btn btn-filled btn-full" id="btn-save-footer" style="height:52px;border-radius:var(--radius-md)" onclick="goTo('Settings_C.html')">
      Guardar cambios
    </button>
  </div>

</div>

<!-- Photo bottom sheet -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheetOnBg(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Foto de perfil</div>
    <div class="sheet-item">
      <span class="material-symbols-rounded">photo_camera</span>
      Tomar foto
    </div>
    <div class="sheet-item">
      <span class="material-symbols-rounded">photo_library</span>
      Elegir de galería
    </div>
    <div class="sheet-item" style="color:var(--error)">
      <span class="material-symbols-rounded" style="color:var(--error)">delete</span>
      Eliminar foto actual
    </div>
  </div>
</div>

<script>
  function goTo(page) { window.location.href = page; }

  function openSheet() {
    document.getElementById('sheet-overlay').classList.add('open');
  }
  function closeSheetOnBg(e) {
    if (e.target === document.getElementById('sheet-overlay')) {
      document.getElementById('sheet-overlay').classList.remove('open');
    }
  }
</script>
</body>
</html>
