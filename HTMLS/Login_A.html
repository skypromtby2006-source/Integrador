<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Didactai — Entrar</title>
  <link rel="stylesheet" href="m3-theme.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  <style>
    body { overflow-y: auto; }
    .screen { justify-content: flex-start; }

    .blob-tl {
      position: absolute; width: 220px; height: 220px;
      top: -60px; left: -40px; border-radius: 50%;
      background: radial-gradient(circle, rgba(89,255,204,.30) 0%, transparent 70%);
      pointer-events: none;
    }
    .blob-br {
      position: absolute; width: 200px; height: 200px;
      bottom: 120px; right: -80px; border-radius: 50%;
      background: radial-gradient(circle, rgba(210,58,173,.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-form {
      padding: 64px 24px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 0;
      position: relative; z-index: 1;
    }

    .brand-icon {
      width: 80px; height: 80px; border-radius: 28px;
      background: linear-gradient(135deg, #40798C 0%, #5A6FA0 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 42px; height: 42px; }

    .brand-name {
      font-size: 28px; font-weight: 500; margin-top: 18px;
      color: var(--on-surface);
    }
    .brand-name span { color: var(--tertiary); }
    .brand-sub {
      font-size: 11px; letter-spacing: 1.5px; font-weight: 500;
      color: var(--on-surface-variant); margin-top: 4px;
    }

    .fields { width: 100%; margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }

    .forgot { width: 100%; text-align: right; }
    .forgot button {
      background: none; border: none; color: var(--primary);
      font-size: 14px; font-weight: 500; cursor: not-allowed; padding: 8px 4px;
      opacity: .5; pointer-events: none;
    }

    .btn-entrar { margin-top: 4px; }

    .or-row {
      width: 100%; display: flex; align-items: center; gap: 12px;
      padding: 20px 0;
    }
    .or-line { flex: 1; height: 1px; background: var(--outline-variant); }
    .or-text { font-size: 12px; color: var(--on-surface-variant); font-weight: 500; }

    .btn-google, .btn-class {
      width: 100%; height: 52px; border-radius: var(--radius-md);
      border: 1px solid var(--outline-variant); background: transparent;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 14px; font-weight: 500; cursor: not-allowed; margin-bottom: 12px;
      color: var(--on-surface); font-family: inherit;
      opacity: .38; pointer-events: none;
    }

    .class-hash {
      width: 22px; height: 22px; border-radius: 8px;
      background: var(--tertiary-container); color: var(--on-tertiary-container);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
    }

    .footer {
      margin-top: 32px; font-size: 14px;
      color: var(--on-surface-variant); text-align: center;
    }
    .footer .link {
      color: var(--primary); font-weight: 500;
      opacity: .5; cursor: not-allowed;
    }

    .google-icon { width: 18px; height: 18px; }
  </style>
</head>
<body>
<div class="screen">
  <div class="blob-tl"></div>
  <div class="blob-br"></div>

  <div class="login-form">
    <!-- Brand mark -->
    <div class="brand-icon">
      <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Heart outline -->
        <path d="M21 34C21 34 9 27 9 18.3C9 13.5 12.8 10.5 16.5 10.5C18.7 10.5 20.2 11.5 21 12.8C21.8 11.5 23.3 10.5 25.5 10.5C29.2 10.5 33 13.5 33 18.3C33 27 21 34 21 34Z"
              fill="rgba(255,255,255,.22)" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- EKG line -->
        <polyline points="6,23 12,23 14,19 17,30 20,21 22,27 36,27"
                  stroke="#59FFCC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>

    <div class="brand-name">didact<span>ai</span></div>
    <div class="brand-sub">TU CUERPO · EXPLORADO</div>

    <!-- Fields -->
    <div class="fields">
      <div class="field-wrap has-value">
        <span class="field-icon material-symbols-rounded" style="font-size:20px">mail</span>
        <input type="email" id="email" value="ana@escuela.mx" autocomplete="email">
        <label for="email">Correo</label>
      </div>

      <div class="field-wrap has-value">
        <span class="field-icon material-symbols-rounded" style="font-size:20px">lock</span>
        <input type="password" id="password" value="anatomia2026" autocomplete="current-password">
        <label for="password">Contraseña</label>
        <button class="field-trail icon-btn" onclick="togglePwd()" type="button" id="pwd-toggle">
          <span class="material-symbols-rounded" style="font-size:20px" id="pwd-icon">visibility</span>
        </button>
      </div>
    </div>

    <div class="forgot">
      <button type="button">¿Olvidaste tu contraseña?</button>
    </div>

    <!-- Entrar -->
    <button class="btn btn-filled btn-full btn-entrar" onclick="goTo('Home_C.html')">
      Entrar
      <span class="material-symbols-rounded" style="font-size:18px">arrow_forward</span>
    </button>

    <!-- Divider -->
    <div class="or-row">
      <div class="or-line"></div>
      <span class="or-text">o continúa con</span>
      <div class="or-line"></div>
    </div>

    <!-- Google — sin destino aún, desactivado -->
    <button class="btn-google" disabled aria-disabled="true" tabindex="-1">
      <svg class="google-icon" viewBox="0 0 18 18" fill="none">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
        <path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.963L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continuar con Google
    </button>

    <!-- Código de clase — sin destino aún, desactivado -->
    <button class="btn-class" disabled aria-disabled="true" tabindex="-1">
      <div class="class-hash">#</div>
      Usar código de clase
    </button>

    <!-- Footer -->
    <div class="footer">
      ¿nueva por aquí?
      <span class="link" onclick="return false;" aria-disabled="true">crear cuenta</span>
    </div>
  </div>
</div>

<script>
  function goTo(page) { window.location.href = page; }

  function togglePwd() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('pwd-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  document.querySelectorAll('.field-wrap input').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.closest('.field-wrap').classList.toggle('has-value', inp.value.length > 0);
    });
    inp.addEventListener('focus', () => inp.closest('.field-wrap').classList.add('has-value'));
    inp.addEventListener('blur',  () => {
      if (!inp.value) inp.closest('.field-wrap').classList.remove('has-value');
    });
  });
</script>
</body>
</html>
