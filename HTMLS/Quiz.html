<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Didactai — Quiz</title>
  <link rel="stylesheet" href="m3-theme.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  <style>
    .screen { height: 100dvh; }

    .progress-linear {
      height: 4px; background: var(--surface-container-highest);
      margin: 0 16px 0;
    }
    .progress-linear-fill { height: 4px; background: var(--primary); border-radius: 2px; transition: width .3s; }

    .quiz-body { flex: 1; overflow-y: auto; padding: 16px 16px 0; }

    .question-topic {
      font-size: 11px; letter-spacing: 1.5px; font-weight: 500;
      color: var(--primary); margin-bottom: 12px;
    }
    .question-text {
      font-size: 22px; font-weight: 400; line-height: 1.35;
      color: var(--on-surface); margin-bottom: 24px;
    }

    .option-btn {
      width: 100%; border: 1.5px solid var(--outline-variant);
      border-radius: var(--radius-md); padding: 14px 16px;
      text-align: left; font-size: 16px; font-weight: 400;
      color: var(--on-surface); background: var(--surface-container-lowest);
      cursor: pointer; margin-bottom: 10px; font-family: inherit;
      display: flex; align-items: center; gap: 12px;
      transition: border-color .15s, background .15s;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-container); }
    .option-btn.selected-wrong   { border-color: var(--error); background: var(--error-container); color: var(--on-error-container); }
    .option-btn.selected-correct { border-color: var(--success); background: var(--success-container); color: var(--on-success-container); }
    .option-btn.correct-reveal   { border-color: var(--success); background: var(--success-container); color: var(--on-success-container); }
    .option-btn:disabled { cursor: default; }

    .option-letter {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-container); font-size: 13px; font-weight: 500;
    }

    .feedback-bar {
      margin-top: 12px; padding: 12px 16px; border-radius: var(--radius-md);
      display: none; align-items: center; gap: 8px; font-size: 14px;
    }
    .feedback-bar.correct { display: flex; background: var(--success-container); color: var(--on-success-container); }
    .feedback-bar.wrong   { display: flex; background: var(--error-container);   color: var(--on-error-container); }

    .action-dock {
      padding: 12px 16px 16px;
      background: var(--background);
      border-top: 1px solid var(--outline-variant);
    }
    .skip-btn {
      background: none; border: none; font-size: 14px; font-weight: 500;
      color: var(--on-surface-variant); cursor: pointer; font-family: inherit;
      padding: 10px 0; display: block; text-align: center; width: 100%;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
<div class="screen">

  <!-- Top bar — back → Home_C.html -->
  <div class="top-bar">
    <button class="icon-btn" id="btn-back" onclick="goTo('Home_C.html')">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <div class="bar-title" id="bar-counter" style="font-size:16px;font-weight:500">Pregunta 1 de 8</div>
    <div class="bar-actions">
      <button class="icon-btn" id="btn-close" onclick="goTo('Home_C.html')">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  </div>

  <!-- Linear progress -->
  <div class="progress-linear">
    <div class="progress-linear-fill" id="prog-fill" style="width:12.5%"></div>
  </div>

  <!-- Quiz body -->
  <div class="quiz-body" id="quiz-body">
    <div class="question-topic" id="q-topic"></div>
    <div class="question-text" id="q-text"></div>
    <div id="options-container"></div>
    <div class="feedback-bar" id="feedback-bar">
      <span class="material-symbols-rounded" id="feedback-icon">check_circle</span>
      <span id="feedback-text"></span>
    </div>
  </div>

  <!-- Action dock -->
  <div class="action-dock">
    <button class="skip-btn" id="skip-btn" onclick="handleSkip()">Saltar pregunta</button>
    <button class="btn btn-filled btn-full" id="next-btn" style="height:52px;border-radius:var(--radius-md)" disabled onclick="handleNext()">
      Siguiente pregunta
      <span class="material-symbols-rounded" style="font-size:18px">arrow_forward</span>
    </button>
  </div>

</div>

<script>
  function goTo(page) { window.location.href = page; }

  const questions = [
    { topic: "Corazón · Cámaras", text: "¿Cuántas cámaras tiene el corazón humano?", options: ["2","3","4","5"], correct: 2 },
    { topic: "Corazón · Flujo", text: "La sangre sale del corazón hacia el cuerpo por…", options: ["Vena cava","Aorta","Arteria pulmonar","Vena pulmonar"], correct: 1 },
    { topic: "Corazón · Cámaras", text: "¿Cuál cámara bombea sangre oxigenada al resto del cuerpo?", options: ["Aurícula izquierda","Ventrículo izquierdo","Aurícula derecha","Ventrículo derecho"], correct: 1 },
    { topic: "Circulación · Vasos", text: "¿Qué llevan las arterias pulmonares?", options: ["Sangre oxigenada","Sangre con CO₂","Linfa","Plasma"], correct: 1 },
    { topic: "Corazón · Válvulas", text: "Función principal de las válvulas cardíacas:", options: ["Bombear sangre","Evitar retroceso de sangre","Filtrar glóbulos","Producir oxígeno"], correct: 1 },
    { topic: "Circulación · Pulso", text: "El pulso que sientes refleja…", options: ["Respiración pulmonar","Contracción del ventrículo","Dilatación de venas","Ritmo del nervio vago"], correct: 1 },
    { topic: "Circulación · Retorno", text: "Las venas regresan la sangre a…", options: ["Ventrículo izquierdo","Pulmones","Aurícula derecha","Aorta"], correct: 2 },
    { topic: "Circulación · Circuitos", text: "¿Cuántos circuitos tiene la circulación sanguínea?", options: ["1 (general)","2 (mayor y menor)","3 (mayor, menor y portal)","4"], correct: 1 },
  ];

  let current = 0;
  let answered = false;
  const letters = ["A","B","C","D"];

  function render() {
    const q = questions[current];
    answered = false;

    document.getElementById('bar-counter').textContent = `Pregunta ${current+1} de ${questions.length}`;
    document.getElementById('prog-fill').style.width = `${((current+1)/questions.length)*100}%`;
    document.getElementById('q-topic').textContent = q.topic;
    document.getElementById('q-text').textContent = q.text;

    const fb = document.getElementById('feedback-bar');
    fb.className = 'feedback-bar';

    const nextBtn = document.getElementById('next-btn');
    nextBtn.disabled = true;
    nextBtn.textContent = current === questions.length - 1 ? 'Ver resultados' : 'Siguiente pregunta';
    // re-add icon
    nextBtn.innerHTML = (current === questions.length - 1 ? 'Ver resultados' : 'Siguiente pregunta') +
      ' <span class="material-symbols-rounded" style="font-size:18px">arrow_forward</span>';
    nextBtn.onclick = handleNext;

    document.getElementById('skip-btn').style.display = 'block';

    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-letter">${letters[i]}</span> ${opt}`;
      btn.onclick = () => selectAnswer(i, btn);
      container.appendChild(btn);
    });
  }

  function selectAnswer(index, btn) {
    if (answered) return;
    answered = true;

    const q = questions[current];
    const buttons = document.querySelectorAll('.option-btn');
    const fb = document.getElementById('feedback-bar');

    buttons.forEach(b => b.disabled = true);

    if (index === q.correct) {
      btn.classList.add('selected-correct');
      fb.className = 'feedback-bar correct';
      document.getElementById('feedback-icon').textContent = 'check_circle';
      document.getElementById('feedback-text').textContent = '¡Correcto!';
    } else {
      btn.classList.add('selected-wrong');
      buttons[q.correct].classList.add('correct-reveal');
      fb.className = 'feedback-bar wrong';
      document.getElementById('feedback-icon').textContent = 'cancel';
      document.getElementById('feedback-text').textContent = `Respuesta correcta: ${q.options[q.correct]}`;
    }

    document.getElementById('next-btn').disabled = false;
    document.getElementById('skip-btn').style.display = 'none';
  }

  function handleNext() {
    if (current < questions.length - 1) {
      current++;
      render();
    } else {
      goTo('Quiz_Results.html');
    }
  }

  function handleSkip() {
    if (current < questions.length - 1) {
      current++;
      render();
    } else {
      goTo('Quiz_Results.html');
    }
  }

  render();
</script>
</body>
</html>
