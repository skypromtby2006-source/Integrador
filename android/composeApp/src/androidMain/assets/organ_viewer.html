<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Órgano</title>
  <script type="module" src="model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #12151A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 85vh;
      background: transparent;
    }
    #organ-name {
      color: #59FFCC;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px;
      opacity: 0.85;
    }
    #tap-hint {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div id="organ-name">Cargando...</div>

  <model-viewer
    id="viewer"
    src=""
    alt="Modelo 3D del órgano"
    auto-rotate
    camera-controls
    shadow-intensity="1"
    exposure="1.2"
    style="--progress-bar-color: #59FFCC;">
  </model-viewer>

  <div id="tap-hint">toca para explorar · arrastra para rotar</div>

  <script>
    // La app Android llama a esta función via evaluateJavascript()
    function loadOrgan(organId, organName, modelPath) {
      const viewer = document.getElementById('viewer');
      const nameEl = document.getElementById('organ-name');
      viewer.src = modelPath;
      nameEl.textContent = organName;
    }

    // Notifica a Android cuando el modelo termina de cargar
    document.getElementById('viewer').addEventListener('load', function() {
      if (window.AndroidBridge) {
        window.AndroidBridge.onModelLoaded();
      }
    });

    // Notifica a Android cuando el usuario toca el modelo
    document.getElementById('viewer').addEventListener('click', function() {
      if (window.AndroidBridge) {
        window.AndroidBridge.onModelTapped();
      }
    });
  </script>
</body>
</html>
